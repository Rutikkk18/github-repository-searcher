spring.application.name=githubsearcher

# Aiven PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://githubsearcherdb-githubsearcher.k.aivencloud.com:17995/defaultdb?sslmode=require}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD}

# Aiven's limit is 15 connections, so keep the pool small
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# GitHub API
github.api.base-url=https://api.github.com
github.api.token=${GITHUB_TOKEN:}
server.port=${PORT:8080}